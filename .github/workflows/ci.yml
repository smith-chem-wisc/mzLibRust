name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The `live` job below runs only on `schedule` or `workflow_dispatch`, and until now this block
  # offered neither — so its condition could never be true and the job had never run once. It was
  # unreachable code wearing the shape of a test: visible in the file, counted as coverage by anyone
  # reading it, and executing nothing. Its `exit 1` placeholder was never even reached, which is why
  # nothing ever complained about it.
  #
  # Found by trying to dispatch it (HTTP 422, "Workflow does not have 'workflow_dispatch' trigger"),
  # not by reading it. mzLibR's equivalent workflow has had both triggers all along; this file was
  # the odd one out, and the divergence was invisible because the missing half was an absence.
  schedule:
    # Thursdays, offset from mzLibR's Monday canaries so a bridge that breaks the contract produces
    # two independent reports on different days rather than one confusing pile.
    - cron: "0 6 * * 4"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The offline suite must pass with no network and no bridge staged. That is the contract: a
  # contributor should be able to clone, `cargo test`, and be green without a 130 MB payload.
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --doc

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # Live canaries against PRIDE Archive and UniProt, through a real bridge. Scheduled rather than
  # per-push: they cost network time, and they SKIP on an outage, so a red result here is a genuine
  # contract break — mzLib, PRIDE or UniProt changing under us.
  live:
    name: live canaries
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This used to be `exit 1` with a comment saying it was waiting for pyMzLib to publish raw
      # bridge binaries as release assets. It does now, from v0.1.0.dev4 onward, so the wait is over.
      #
      # The tarball, not the wheel. mzLibR reached the binary by unzipping a Python wheel because
      # nothing neutral was published; a Rust crate has no business knowing what a wheel is, and now
      # does not have to. tar rather than zip is what makes this three lines instead of four: tar
      # restores the execute bit, verified on the real asset — the published linux payload records
      # `-rwxr-xr-x` — whereas an unzip would land a non-executable file and need a chmod.
      - name: Fetch the bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The newest release, including prereleases: every pyMzLib release so far is one, and
          # `releases/latest` skips them. This deliberately tracks the newest rather than pinning,
          # because the job's purpose is to notice when the CURRENT bridge breaks the contract.
          tag=$(gh api repos/smith-chem-wisc/pyMzLib/releases --jq '.[0].tag_name')
          echo "Staging the mzLib bridge for linux-x64 from pyMzLib $tag"

          gh release download "$tag" --repo smith-chem-wisc/pyMzLib \
            --pattern 'mzlib-bridge-linux-x64.tar.gz' --pattern 'SHA256SUMS'

          # Verified against the published manifest, not taken on the strength of HTTPS. `-c` fails
          # the job on a mismatch, which is the point: a corrupted 160 MB payload should stop here
          # rather than surface later as an inexplicable test failure.
          grep 'mzlib-bridge-linux-x64.tar.gz' SHA256SUMS | sha256sum -c -

          mkdir -p _dotnet/linux-x64
          tar -xzf mzlib-bridge-linux-x64.tar.gz -C _dotnet/linux-x64

          # Prove it runs before any test blames the crate for the payload.
          ./_dotnet/linux-x64/mzlib-bridge version
      - run: cargo test --features live
        env:
          MZLIB_BRIDGE: ${{ github.workspace }}/_dotnet/linux-x64/mzlib-bridge
