[package]
name = "mzlib"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "mzLib for Rust — mass spectrometry and proteomics, backed by the mzLib bridge."
repository = "https://github.com/smith-chem-wisc/mzLibRust"
# mzLib is LGPL-3.0, and this crate exists to redistribute and drive it. Anything more permissive
# here would be a licence violation, not a preference — the same reasoning pyMzLib's wheel follows.
license = "LGPL-3.0-or-later"
keywords = ["proteomics", "mass-spectrometry", "mzlib", "flashlfq", "pride"]
categories = ["science", "api-bindings"]
readme = "README.md"

[dependencies]
# Deliberately minimal and well-established. The Python sibling declares zero runtime
# dependencies; that exact goal does not translate to Rust, where serde IS the idiom, so the
# rule here is "nothing heavy or exotic" instead. No regex (both accession grammars are
# hand-rolled and tested), no wait-timeout (bridge.rs does its own).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
# The stand-in bridge the doc examples run against (tools/replay-bridge). Path-only, so it is
# stripped from the published manifest: it exists for this repository's doctests alone.
mzlib-replay = { path = "tools/replay-bridge" }
# tests/spec_docs.rs reads the vendored verb specs (YAML) and this crate's own source (syn), to
# render the reference facts and hold every documented field to its spec's unit.
serde_yaml = "0.9"
syn = { version = "2", default-features = false, features = ["full", "parsing", "clone-impls", "extra-traits"] }

[features]
default = []
# Live canaries against EBI's PRIDE Archive and UniProt. Off by default: the offline suite must
# pass with no network and no bridge present. These SKIP rather than fail when a service is down.
live = []

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
