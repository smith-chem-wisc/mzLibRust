[package]
name = "mzlib-replay"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
description = "A stand-in mzLib bridge that answers from recorded fixtures, so mzLibRust's doc examples run."
license = "LGPL-3.0-or-later"
# A dev-dependency of mzlib only: its doctests call `mzlib_replay::activate()`. Never published, and
# stripped from the published crate's manifest because it is a path-only dev-dependency.
publish = false

[dependencies]

[build-dependencies]
# The recordings are parsed at build time, so the stand-in bridge itself is std-only.
serde_json = "1"
